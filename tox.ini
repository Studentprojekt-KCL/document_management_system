[tox]
requires = 
    tox>=4
envlist = pylintEnv, ruffEnv, formatting_env, mypy, unittest_env

[testenv]
deps =
    ruff>=0.6
    pylint>=3
    black
    mypy>=1.19

[testenv:pylintEnv]
commands = pylint --ignore=.env,venv,__pycache__,.tox {toxinidir}

[testenv:ruffEnv]
commands = ruff check --exclude .env,venv,__pycache__,.tox {toxinidir}

[testenv:mypy]
commands = mypy --disallow-untyped-defs --exclude "(\.env|venv|__pycache__)|\.tox" {toxinidir} 

[testenv:formatting_env]
commands = black -l 132 --exclude "/(\.env|venv|__pycache__)/|\.tox" {toxinidir}

