[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "connector-gateway"
description = "Main interface to connectors"
dynamic = ["dependencies"]
version = "0.0.1"

[tool.setuptools]
package-dir = {"" = "src/connector_gateway"}

[project.scripts]
connector_gateway = "api:run"
