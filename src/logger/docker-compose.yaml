services:
  logger-endpoint:
    image: logger-endpoint:latest
    env_file: logger_endpoint.env
    build: ./endpoint/
    ports:
      - "8000:8000"
    volumes:
      - ./endpoint/src:/src

  logger-database:
    image: logger-database:latset
    env_file: logger_database.env
    build: ./database
    ports:
      - "3306:3306"
