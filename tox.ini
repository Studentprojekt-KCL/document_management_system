[tox]
skipsdist = false
requires = 
    tox>=4
envlist = pylint, ruffEnv, formatting_env, mypy-api, unittest_env

[testenv]
deps =
    setuptools
    ruff>=0.6
    pylint>=3
    black
    mypy>=1.19
    types-requests
    -e ./src/shared_functions
package = wheel

[testenv:pylint]
commands = pylint {toxinidir}/src

[testenv:ruffEnv]
commands = ruff check {toxinidir}/src

[testenv:mypy-api]
setenv =
    MYPYPATH = {toxinidir}/src/shared_functions/logger
commands = mypy src

[testenv:formatting_env]
commands = black {toxinidir}/src

[testenv:unittest_env]
#TODO, add unittests

[testenv:frontend_env]
allowlist_externals = npm
change_dir = {toxinidir}/src/front_end
commands = 
    npm install 
    npm run lint