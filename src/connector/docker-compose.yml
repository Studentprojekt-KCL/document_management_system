version: "3.9"

services:

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - smb
      - gitlab

  smb:
    build: ./connectors/smb
    ports:
      - "8001:8001"
    environment:
      - SMB_CONNECTOR_PORT=8001
      - SMB_CONNECTOR_HOST=0.0.0.0
      - SMB_BASE_PATH=/mnt/Kernel/projB
      - SMB_MAX_FILE_SIZE=5000000
      - SMB_ALLOWED_EXTENSIONS=.txt,.md,.xml,.pdf,.docx,.xlsx
      - SMB_SKIP_DIRS=drivers,tools,.git,.benchmark_test_perms,.merkle_cache
      - SMB_MAX_WORKERS=16
      - SMB_CACHE_DIR=.merkle_cache
      - SMB_MAX_BATCH_SIZE=50
      - SMB_API_MAX_WORKERS=8

  gitlab:
    build: ./connectors/gitlab
    ports:
      - "8002:8002"
    environment:
      - GITLAB_CONNECTOR_PORT=8002
      - GITLAB_ADDRESS=https://your.gitlab.instance 
