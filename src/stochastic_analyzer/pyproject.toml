[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-analyzer"
version = "1.0.0"
description = "Unified query gateway service"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["gateway", "gateway.services"]

[project.scripts]
reranker = "gateway.main:start"