name: Build on pull request for develop branch
on:
  pull_request:
    branches: ["develop"]

env:
  COMPOSE_FILE: "docker-compose-build-all.yaml"
  
jobs:
  build:
    permissions:
      contents: read
    runs-on: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker images in repo
        run: docker compose -f $COMPOSE_FILE build --pull
        