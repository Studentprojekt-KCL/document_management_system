name: Push and Deploy Images

on:
  push:
    branches: ["develop"]

env:
  DEPLOY_DIR: "/opt/dev-dms-lookup/"
  COMPOSE_FILE: "docker-compose-build-all.yaml"
  REGISTRY: "registry.dms-lookup.com"

jobs:
  deploy:
    runs-on: development
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker compose -f $COMPOSE_FILE build

      - name: Push images to registry
        run: |
          set -euo pipefail
          IMAGES="$(docker compose -f $COMPOSE_FILE config --images)"
          echo "Images from compose:"
          echo "$IMAGES"
          
          # Give every image a tag
          # <image>:latest
          #
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            base="$img"
            if echo "$img" | grep -qE ':[^/]+$'; then
              base="${img%:*}"
            fi
        
            # Strip registry if already present
            base_no_registry="${base#*/}"
        
            full="$REGISTRY/$base_no_registry"
        
            echo "Tagging $img -> $full:latest"
            docker tag "$img" "$full:latest"
            echo "Pushing $full:latest"
            docker push "$full:latest"
          done <<< "$IMAGES"

      - name: Redeploy images
        run: |
          set -euo pipefail
          cd $DEPLOY_DIR
          cat .env.pr > .env
          docker compose -f docker-compose.yaml pull
          docker compose -f docker-compose.yaml up -d --remove-orphans
