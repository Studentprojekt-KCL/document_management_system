[build-system]
requires = [
  "setuptools >= 77.0.3",
  "fastapi[standard] >= 0.128"
]
build-backend = "setuptools.build_meta"

[project]
name = "se_api"
description = "Search Engine"
dependencies = [
  "fastapi[standard] >= 0.128",
  "dmis-shared-functions @ file:../shared_functions"
]
dynamic = ["version"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
se_api = "se_api.api:run"

