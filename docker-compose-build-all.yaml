services:
  log-api:
    image: log-api:pr
    build:
      dockerfile: src/logger/api/Dockerfile

  log-database:
    image: log-database:pr
    build: 
      dockerfile: src/logger/database/Dockerfile

  search-engine:
    image: search-engine:pr
    build:
      dockerfile: src/search_engine/Dockerfile

  dmis-api:
    image: dmis-api:pr
    build:
      dockerfile: src/api/Dockerfile

  front-end:
    image: front-end:pr
    build: ./src/front_end

  connector-gitlab:
    image: connector-gitlab:pr
    build:
      dockerfile: src/connectors/gitlab/Dockerfile

  connector-github:
    image: connector-github:pr
    build:
      dockerfile: src/connectors/github/Dockerfile

  connector-minio:
    image: connector-minio:pr
    build:
      dockerfile: src/connectors/storage-infra/Dockerfile

  stochastic-analyzer:
    image: stochastic-analyzer:pr
    build:
      dockerfile: src/stochastic_analyzer/Dockerfile
      
  connector-gateway:
    image: connector-gateway:pr
    build:
      dockerfile: src/connectors/connector-gateway/Dockerfile
