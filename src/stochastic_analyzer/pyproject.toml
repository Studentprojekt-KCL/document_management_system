[build-system]
requires = [
    "setuptools >= 77.0.3",
    "fastapi[standard] >= 0.128",
]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-analyzer"
version = "1.0.0"
description = "Unified query gateway service"
dependencies = [
    "fastapi[standard] >= 0.128",
    "pydantic-settings",
    "numpy<2.0.0",
    "torch",
    "sentence-transformers",
    "httpx",
]

[tool.setuptools]
packages = ["gateway", "gateway.services"]

[project.scripts]
reranker = "gateway.main:start"