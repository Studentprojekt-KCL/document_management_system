[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-functions"
version = "0.1.0"
description = "Library containing shared functions used in DMIS."
dependencies = [
    "requests>=2.32",
    "boto3>=1.42",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shared_functions = ["data/file_types.json", "data/documents_only_types.json"]
