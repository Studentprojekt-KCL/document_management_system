[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmis_api"
version = "0.0.1"
description = "Library for main DMIS main API."
dependencies = [
    "fastapi[standard]>=0.128",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "shared-functions",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
dmis_api = "dmis_api.api:run"